<div *ngIf="row">
    <lib-grid-row [input]="row" [month]="month" [year]="year" [rowHeaderColumnWidth]="rowHeaderColumnWidth"
        [columnWidth]="columnWidth" [entries]="entries[row.key]" [indentationLevel]="indentationLevel">
    </lib-grid-row>
</div>

<div *ngIf="group">
    <lib-grid-row-header [rowHeight]="40" [indentationLevel]="indentationLevel"
        [rowHeaderColumnWidth]="rowHeaderColumnWidth" [text]="group.name"
        [showCollapseButton]="true" [(isCollapsed)]="group.isCollapsed">
    </lib-grid-row-header>
    <lib-grid-simple-row [columnWidth]="columnWidth" [numberOfDays]="numberOfDaysInMonth" [rowHeight]="40">
    </lib-grid-simple-row>

    <div style="vertical-align: top;" *ngIf="!group.isCollapsed">
        <lib-grid-row-or-group *ngFor="let sub of group.subs" [input]="sub" [month]="month" [year]="year"
            [rowHeaderColumnWidth]="rowHeaderColumnWidth" [columnWidth]="columnWidth" [entries]="entries"
            [indentationLevel]="indentationLevel+1">
        </lib-grid-row-or-group>
    </div>
</div>
