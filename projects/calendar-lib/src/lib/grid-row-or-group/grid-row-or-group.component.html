<div *ngIf="row">
    <lib-grid-row [input]="row" [month]="month" [year]="year" [rowHeaderColumnWidth]="rowHeaderColumnWidth"
        [columnWidth]="columnWidth" [entries]="entries[row.key]"
        [indentationLevel]="useLinearLayout ? 0 : indentationLevel" [rowTemplate]="rowTemplate"
        [useCompactLayout]="useCompactLayout">
    </lib-grid-row>
    <lib-grid-row-line></lib-grid-row-line>
</div>

<div *ngIf="group">
    <lib-grid-row-header [showTopBorder]="true" [indentationLevel]="useLinearLayout ? 0 : indentationLevel"
        [rowHeaderColumnWidth]="rowHeaderColumnWidth" [text]="group.name" [showCollapseButton]="true"
        [(isCollapsed)]="group.isCollapsed" [isBold]="!!group.fontStyle && group.fontStyle.isBold"
        [isItalic]="!!group.fontStyle && group.fontStyle.isItalic">
    </lib-grid-row-header>

    <lib-grid-row-line *ngIf="useCompactLayout"></lib-grid-row-line>

    <lib-grid-templated-row [year]="year" [month]="month" [numberOfDaysInMonth]="numberOfDaysInMonth"
        [useCompactLayout]="useCompactLayout" [columnWidth]="columnWidth" [entries]="entries[group.key]"
        [rowTemplate]="rowTemplate">
    </lib-grid-templated-row>

    <lib-grid-row-line></lib-grid-row-line>

    <div style="vertical-align: top;" *ngIf="!group.isCollapsed">
        <lib-grid-row-or-group *ngFor="let sub of group.subs" [input]="sub" [month]="month" [year]="year"
            [rowHeaderColumnWidth]="rowHeaderColumnWidth" [columnWidth]="columnWidth" [entries]="entries"
            [indentationLevel]="indentationLevel+1" [rowTemplate]="rowTemplate" [useCompactLayout]="useCompactLayout"
            [useLinearLayout]="useLinearLayout">
        </lib-grid-row-or-group>
    </div>
</div>
