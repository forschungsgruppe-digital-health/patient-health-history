<svg style="vertical-align: top;display: inline-block;" [attr.width]="numberOfDays*columnWidth + 1"
    [attr.height]="rowHeight">
    <svg *ngFor="let day of linesToRender">
        <line class="calendar-lib_grid-vertical-line" [attr.x1]="(day-1)*columnWidth + 0.5" [attr.x2]="(day-1)*columnWidth + 0.5" y1="0" y2="40"></line>

        <text [attr.text-anchor]="useCompactLayout?'left':'middle'" alignment-baseline="central" [attr.x]="(day-1)*columnWidth + (useCompactLayout?5:columnWidth/2)" [attr.y]="rowHeight/2">{{day}}</text>
    </svg>

    <!-- most right line -->
    <line class="calendar-lib_grid-vertical-line" [attr.x1]="numberOfDays*columnWidth + 0.5" [attr.x2]="numberOfDays*columnWidth + 0.5" y1="0" y2="40">
    </line>
</svg>
