<lib-grid-row-line></lib-grid-row-line>
<lib-grid-row-header [indentationLevel]="0" [showTopBorder]="true" [rowHeaderColumnWidth]="rowHeaderColumnWidth"
    text="Zeitleiste" [isBold]="true"></lib-grid-row-header>

<lib-grid-days-row [columnWidth]="columnWidth" [numberOfDays]="numberOfDaysInMonth"
    [useCompactLayout]="useCompactLayout" [firstLineInCompactLayoutOffset]="firstLineInCompactLayoutOffset">
</lib-grid-days-row>

<lib-grid-row-line></lib-grid-row-line>

<div style="vertical-align: top;" *ngIf="groups">
    <lib-grid-row-or-group *ngFor="let group of groups" [input]="group" [month]="month" [year]="year"
        [rowTemplate]="rowTemplate" [rowHeaderColumnWidth]="rowHeaderColumnWidth" [columnWidth]="columnWidth"
        [entries]="entries" [useCompactLayout]="useCompactLayout" [useLinearLayout]="useLinearLayout">
    </lib-grid-row-or-group>
</div>
