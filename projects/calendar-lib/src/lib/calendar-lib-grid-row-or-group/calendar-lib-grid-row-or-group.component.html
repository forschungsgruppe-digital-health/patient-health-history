<div *ngIf="row">
    <lib-calendar-lib-grid-row [input]="row" [month]="month" [year]="year" [rowHeaderColumnWidth]="rowHeaderColumnWidth" [columnWidth]="columnWidth"></lib-calendar-lib-grid-row>
</div>

<div *ngIf="group">
    <span [style.width.px]="rowHeaderColumnWidth" style="display: inline-block;">{{group.name}}</span>
    <svg style="display: inline-block;" [attr.width]="daysInMonth.length*columnWidth" height="40px">
        <line *ngFor="let day of daysInMonth; let i= index;" stroke="black" [attr.x1]="i*columnWidth"
            [attr.x2]="i*columnWidth" y1="0" y2="40"></line>
        <line stroke="black" [attr.x1]="daysInMonth.length*columnWidth" [attr.x2]="daysInMonth.length*columnWidth" y1="0"
            y2="40"></line>
    </svg>
    <div style="margin-left:20px;">
        <lib-calendar-lib-grid-row-or-group *ngFor="let sub of group.subs" [input]="sub" [month]="month" [year]="year"
        [rowHeaderColumnWidth]="rowHeaderColumnWidth-20" [columnWidth]="columnWidth">
        </lib-calendar-lib-grid-row-or-group>
    </div>
</div>
