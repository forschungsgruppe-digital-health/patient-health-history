<svg style="display: inline-block;vertical-align: top;" [attr.width]="rowHeaderColumnWidth-1" [attr.height]="rowHeight">

    <text [attr.data-isBold]="isBold" [attr.data-isItalic]="isItalic" [attr.y]="rowHeight/2"
        [attr.x]="indentationLevel * 20" alignment-baseline="central">{{text}}</text>

    <svg *ngIf="showCollapseButton" [attr.x]="rowHeaderColumnWidth - rowHeight" (click)="onToggle()">
        <ng-container
            *ngTemplateOutlet="rowHeaderCollapseButtonTemplate;context:{isCollapsed:isCollapsed, rowHeight:rowHeight}">
        </ng-container>
    </svg>
</svg>
