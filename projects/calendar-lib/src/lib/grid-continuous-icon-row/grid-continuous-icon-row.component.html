<svg style="vertical-align: top;display: inline-block;" [attr.width]="numberOfDays*columnWidth + 1"
    [attr.height]="rowHeight">
    <svg>
        <line *ngFor="let day of linesToRender" class="calendar-lib_grid-vertical-line" [attr.x1]="(day-1)*columnWidth + 0.5"
            [attr.x2]="(day-1)*columnWidth + 0.5" y1="0" [attr.y2]="rowHeight"></line>
        <line class="calendar-lib_grid-vertical-line" [attr.x1]="numberOfDays*columnWidth + 0.5" [attr.x2]="numberOfDays*columnWidth + 0.5" y1="0"
            [attr.y2]="rowHeight"></line>
    </svg>

    <svg>
        <line class="calendar-lib_grid-continuous-icon-row_connecting-line" *ngFor="let line of connectingLines"
            [attr.x1]="line.x1" [attr.x2]="line.x2" [attr.y1]="line.y1" [attr.y2]="line.y2"></line>
    </svg>

    <svg>
        <image *ngFor="let entry of entries" [attr.href]="entry.icon" [attr.height]="iconSize" [attr.width]="iconSize"
            [attr.y]="(rowHeight - iconSize) / (maxValue-minValue) * (entry.value - minValue)"
            [attr.x]="columnWidth*(entry.day-1) + (columnWidth-iconSize)/2" />
    </svg>
</svg>
