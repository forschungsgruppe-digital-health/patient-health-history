<svg style="vertical-align: top;display: inline-block;" [attr.width]="numberOfDays*columnWidth"
    [attr.height]="rowHeight">
    <svg>
        <line *ngFor="let day of linesToRender" stroke="black" [attr.x1]="(day-1)*columnWidth"
            [attr.x2]="(day-1)*columnWidth" y1="0" [attr.y2]="rowHeight"></line>
        <line stroke="black" [attr.x1]="numberOfDays*columnWidth" [attr.x2]="numberOfDays*columnWidth" y1="0"
            [attr.y2]="rowHeight"></line>
    </svg>

    <svg>
        <image *ngFor="let entry of entries" [attr.href]="entry.icon" [attr.height]="iconSize" [attr.width]="iconSize"
            [attr.y]="(rowHeight - iconSize) / (maxValue-minValue) * (entry.value - minValue)"
            [attr.x]="columnWidth*(entry.day-1) + (columnWidth-iconSize)/2" />
    </svg>

    <svg>
        <line *ngFor="let line of connectingLines" stroke="black" stroke-dasharray="5 5" stroke-linecap="round"
            [attr.x1]="line.x1" [attr.x2]="line.x2" [attr.y1]="line.y1" [attr.y2]="line.y2"></line>
    </svg>
</svg>
