<svg style="vertical-align: top;display: inline-block;" [attr.width]="numberOfDays*columnWidth + 1"
    [attr.height]="rowHeight * rowCount">
    <svg>
        <line *ngFor="let day of linesToRender;" class="calendar-lib_grid-vertical-line"
            [attr.x1]="(day-1)*columnWidth + 0.5" [attr.x2]="(day-1)*columnWidth + 0.5" y1="0" [attr.y2]="rowHeight * rowCount">
        </line>
        <line class="calendar-lib_grid-vertical-line" [attr.x1]="numberOfDays*columnWidth + 0.5"
            [attr.x2]="numberOfDays*columnWidth + 0.5" y1="0" [attr.y2]="rowHeight * rowCount"></line>
    </svg>

    <svg *ngFor="let entry of entryRenderData" [attr.x]="columnWidth*(entry.entry.day-1)"
        [attr.y]="entry.rowIndex * rowHeight" (click)="onEntryClick(entry.entry)">
        <image [attr.href]="iconPath" [attr.height]="iconSize" [attr.width]="iconSize"
            [attr.y]="(rowHeight-iconSize)/2" />

        <svg [attr.height]="rowHeight-6" [attr.width]="(rowHeight-6)*0.625" viewBox="0 0 1.25 2" [attr.y]="3"
            [attr.x]="iconSize">
            <path d="M0 1 l1 -1 l0.25 0 l0 2 l-0.25 0 l-1 -1" stroke="transparent" fill="lightgray"></path>
        </svg>
        <rect [attr.x]="iconSize+rowHeight/2-3" y="3" [attr.height]="rowHeight-6" [attr.width]="entry.nameWidth+6"
            fill="lightgray"></rect>

        <line [attr.x1]="iconSize" [attr.y1]="rowHeight/2" [attr.x2]="iconSize+rowHeight/2-3" [attr.y2]="3"
            stroke="black" stroke-linecap="round"></line>
        <line [attr.x1]="iconSize" [attr.y1]="rowHeight/2" [attr.x2]="iconSize+rowHeight/2-3" [attr.y2]="rowHeight-3"
            stroke="black" stroke-linecap="round"></line>
        <text style="pointer-events: none" alignment-baseline="central" [attr.y]="rowHeight/2"
            [attr.x]="iconSize+rowHeight/2-3">{{entry.entry.name}}</text>
    </svg>
</svg>
