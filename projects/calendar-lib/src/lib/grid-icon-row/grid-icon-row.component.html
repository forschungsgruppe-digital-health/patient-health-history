<svg style="vertical-align: top;display: inline-block;" [attr.width]="numberOfDays*columnWidth" [attr.height]="rowHeight">
    <svg>
        <line *ngFor="let day of linesToRender" stroke="black" [attr.x1]="(day-1)*columnWidth"
            [attr.x2]="(day-1)*columnWidth" y1="0" [attr.y2]="rowHeight"></line>
        <line stroke="black" [attr.x1]="numberOfDays*columnWidth" [attr.x2]="numberOfDays*columnWidth"
            y1="0" [attr.y2]="rowHeight"></line>
    </svg>

    <svg>
        <image *ngFor="let entry of entries" [attr.href]="entry.icon" [attr.height]="iconSize"
            [attr.width]="iconSize" [attr.y]="(rowHeight - iconSize)/2" [attr.x]="columnWidth*(entry.day-1) + (columnWidth-iconSize)/2" 
            (mouseover)="onMouseOver(entry)" (mouseleave)="onMouseLeave()"/>
    </svg>
</svg>
<svg height="100" [attr.width]="numberOfDays*columnWidth+300" *ngIf="tooltip" 
style="position: absolute;z-index:10000;" 
[style.marginLeft.px]="-numberOfDays*columnWidth"
[style.marginTop.px]="(rowHeight - iconSize)/2+iconSize">
    <path [attr.d]="tooltipPath" stroke="black" fill="wheat"></path>
    <text [attr.y]="tooltipHeight / 2" [attr.x]="tooltipX + 5" alignment-baseline="central">{{tooltip}}</text>
</svg>
